<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="shortcut icon" href="img/copilot logo.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <main class="main" aria-label="GitHub Copilot">
            <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/github-copilot-icon.svg" alt="GitHub Copilot icon" width="40" height="40">
            <h1>Welcome to Copilot</h1>
            <p>Let's get started</p>
        </main>

        <section class="co_message" aria-label="Ask Copilot">
            <form class="input-wrapper" action="#" method="get">
                <label class="sr-only" for="co_text">Ask Copilot</label>
                <input type="text" id="co_text" name="prompt" placeholder="Ask Copilot..." autocomplete="off">
                <button type="button" class="material-symbols-outlined" aria-label="Use email">alternate_email</button>
                <button type="button" class="material-symbols-outlined" aria-label="Use microphone">mic</button>
                <button type="submit" class="material-symbols-outlined" aria-label="Send message">send</button>
                <button type="button" class="material-symbols-outlined" aria-label="More options">expand_more</button>
            </form>
        </section>

        <section class="extra" aria-label="Workspace actions">
            <button class="btn" type="button">
                <span class="material-symbols-outlined">build</span>
                Build workspace
            </button>
            <button class="btn" type="button">
                <span class="material-symbols-outlined">settings</span>
                Show project config
            </button>
        </section>

        <p class="last">Review AI output carefully before use</p>
    </div>
</body>
</html>
