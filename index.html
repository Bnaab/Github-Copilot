<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="shortcut icon" href="img/copilot logo.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="main">
            <!-- <img src="img/download-removebg-preview (1).png" alt="copilot"> -->
             <!-- Embed Copilot icon SVG inline or via <img> -->
<img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/github-copilot-icon.svg" alt="GitHub Copilot icon" width="40" height="40">
            <h1>Welcome to Copilot</h1>
            <p>Let's get started</p>
        </div>

        <div class="co_message">
            <div class="input-wrapper">
                <input type="text" id="co_text" placeholder="Ask Copilot...">
                 <span class="material-symbols-outlined">alternate_email</span>
                <span class="material-symbols-outlined">mic</span>
                <span class="material-symbols-outlined">send</span>
                <span class="material-symbols-outlined">expand_more</span>
            </div>
        </div>


        <div class="extra">
            <button class="btn"><span class="material-symbols-outlined">build</span>Build workspace</button>
            <button class="btn"><span class="material-symbols-outlined">settings</span>Show project config</button>
        </div>

        <p class="last">Review AI output carefully before use</p>
    </div>
</body>
</html>
